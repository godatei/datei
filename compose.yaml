name: datei-dev

services:
  postgres:
    image: 'postgres:18.4-alpine3.23'
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: datei
    volumes:
      - 'postgres:/var/lib/postgresql/'
    ports:
      - '127.0.0.1:5433:5432'

  mailpit:
    image: 'axllent/mailpit:v1.30.3'
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

  # IMAP/SMTP server for testing email receiving. GreenMail auto-creates an
  # account on first login, so any user/password works (e.g. test@datei.local).
  greenmail:
    image: 'greenmail/standalone:2.1.13'
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose'
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3143:3143'
      - '127.0.0.1:3993:3993'

  storage:
    image: 'rustfs/rustfs:1.0.0-alpha.83'
    ports:
      - '127.0.0.1:9002:9000'
      - '127.0.0.1:9003:9001'
    volumes:
      - 'rustfs:/data/'
    environment:
      RUSTFS_ACCESS_KEY: local
      RUSTFS_SECRET_KEY: local

  ocr-server:
    build:
      context: ocrserver
    ports:
      - '127.0.0.1:8082:9003'
    restart: unless-stopped

volumes:
  postgres:
  rustfs:
