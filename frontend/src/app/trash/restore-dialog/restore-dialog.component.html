<h2 mat-dialog-title>Restore "{{ data.name }}"</h2>

<mat-dialog-content class="w-lg min-h-64">
  <app-directory-picker
    [initialPath]="initialPath()"
    (currentChange)="selectedParent.set($event)"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="restore()">
    @if (selectedParent(); as parent) {
      Restore to "{{ parent.name }}"
    } @else {
      Restore to My files
    }
  </button>
</mat-dialog-actions>
