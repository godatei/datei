<section class="flex flex-col gap-4">
  <h3 class="mat-font-title-lg m-0">Multi-Factor Authentication</h3>
  @if (mfaEnabled()) {
    <p class="mat-font-body-md m-0">Multi-factor authentication is enabled for this user.</p>
    <button mat-button color="warn" (click)="disable()" [disabled]="loading()">Disable MFA</button>
  } @else {
    <p class="mat-font-body-md mat-text-on-surface-variant m-0">
      MFA is not enabled. Only the user can set up MFA.
    </p>
  }
</section>
