<h2 mat-dialog-title>Revoke access token?</h2>
<mat-dialog-content>
  <p class="m-0">
    Revoke token
    <strong>{{ data.label }}</strong
    >?
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" (click)="confirm()">Revoke</button>
</mat-dialog-actions>
