<mat-sidenav-container
  class="nav-shell"
  [class.nav-shell-handset]="isHandset()"
  [class.nav-shell-expanded]="expanded()"
>
  <mat-sidenav
    #drawer
    class="nav-rail"
    [class.nav-rail-expanded]="railExpanded()"
    fixedInViewport
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="nav-rail-header">
      @if (!isHandset()) {
        <button
          type="button"
          matIconButton
          [attr.aria-expanded]="expanded()"
          [attr.aria-label]="expanded() ? 'Collapse navigation' : 'Expand navigation'"
          (click)="toggleExpanded()"
        >
          <mat-icon aria-hidden="true">{{ expanded() ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
      }
    </div>
    <nav class="nav-rail-items" aria-label="Main">
      @for (item of navItems; track item.route) {
        <a
          #railItem
          class="nav-rail-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          #rla="routerLinkActive"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="onNavItemClick()"
        >
          <span
            class="nav-rail-indicator"
            matRipple
            [matRippleTrigger]="railItem"
            [matRippleCentered]="true"
            aria-hidden="true"
          ></span>
          <mat-icon aria-hidden="true" [class.material-symbols-outline]="!rla.isActive">{{
            item.icon
          }}</mat-icon>
          <span class="nav-rail-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="nav-topbar">
      @if (isHandset()) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <div class="nav-brand">
        <img ngSrc="datei-logo.svg" alt="Datei" width="32" height="32" />
        <span class="nav-brand-name">Datei</span>
      </div>
      <span class="grow shrink basis-auto"></span>
      <button mat-button [matMenuTriggerFor]="userMenu">
        <app-user-avatar [name]="userName()" size="xs" class="mr-1" />
        {{ userName() }}
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </a>
        @if (isAdmin()) {
          <a mat-menu-item routerLink="/admin/users">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Admin</span>
          </a>
        }
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <div class="nav-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
