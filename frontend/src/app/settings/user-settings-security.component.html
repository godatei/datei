@if (loadFailed()) {
  <div class="flex flex-col items-center gap-4 p-8 text-center">
    <p class="mat-text-error m-0">Failed to load security settings.</p>
    <button mat-stroked-button (click)="load()">Retry</button>
  </div>
} @else if (user(); as u) {
  <div class="flex flex-col gap-10">
    <app-user-password [port]="port" [requireCurrentPassword]="true" />
    <mat-divider />
    <app-user-mfa [port]="port" [mfaEnabled]="u.mfaEnabled" (changed)="refresh()" />
    <mat-divider />
    <app-user-personal-access-tokens />
  </div>
}
