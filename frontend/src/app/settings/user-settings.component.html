<div class="settings-page h-full flex flex-col">
  <div class="grow flex flex-col md:flex-row">
    <div class="mat-bg-surface-container-low p-6 md:self-stretch">
      <h2 class="mat-font-headline-sm m-0">Settings</h2>
      <nav class="md:w-56 shrink-0" aria-label="Settings sections">
        <mat-nav-list>
          <a
            mat-list-item
            routerLink="profile"
            routerLinkActive
            #profileRla="routerLinkActive"
            [activated]="profileRla.isActive"
          >
            Profile
          </a>
          <a
            mat-list-item
            routerLink="security"
            routerLinkActive
            #securityRla="routerLinkActive"
            [activated]="securityRla.isActive"
          >
            Security
          </a>
        </mat-nav-list>
      </nav>
    </div>

    <div class="max-w-2xl mx-auto grow my-10 px-4">
      <router-outlet />
    </div>
  </div>
</div>
