<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="&quot;Datei&quot; is German for file. But also for document. And dataset. Basically anything you really don't want to lose.">
  <defs>
    <linearGradient id="datei-top" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b75e4" />
      <stop offset="1" stop-color="#5acf04" />
    </linearGradient>
    <linearGradient id="datei-bottom" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e40072" />
      <stop offset="1" stop-color="#f4c430" />
    </linearGradient>
    <linearGradient id="datei-fade" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <mask id="datei-vmask">
      <rect width="1200" height="675" fill="url(#datei-fade)" />
    </mask>
    <filter id="datei-text-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#datei-top)" />
  <rect width="1200" height="675" fill="url(#datei-bottom)" mask="url(#datei-vmask)" />
  <g fill="#ffffff" filter="url(#datei-text-shadow)" font-family="'Google Sans', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
    <text x="90" y="312" font-size="62" font-weight="700">"Datei" is German for file.</text>
    <text x="90" y="388" font-size="31" font-weight="400">But also for document. And dataset.</text>
    <text x="90" y="432" font-size="31" font-weight="400">Basically anything you really don&#8217;t want to lose.</text>
  </g>
</svg>
