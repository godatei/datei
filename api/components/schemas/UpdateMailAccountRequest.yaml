type: object
required:
  - name
  - imapHost
  - imapPort
  - username
  - security
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  imapHost:
    type: string
    minLength: 1
  imapPort:
    type: integer
    minimum: 1
    maximum: 65535
  username:
    type: string
    minLength: 1
  password:
    type: string
    minLength: 1
    description: New IMAP password; omit to keep the existing one
  security:
    $ref: './MailAccountSecurity.yaml'
