type: object
required:
  - id
  - createdAt
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier
  label:
    type: string
    description: Human-readable label describing the token's purpose; omitted if unlabeled
  expiresAt:
    type: string
    format: date-time
    description: Expiration timestamp; omitted if the token never expires
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
